site_name: ckanext-dimred
site_url: https://datashades.github.io/ckanext-dimred/
repo_url: https://github.com/DataShades/ckanext-dimred

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.select

nav:
  - Home: index.md
  - Installation and compatibility: installation.md
  - Usage: usage.md
  - Configuration: configuration.md
  - Operations and troubleshooting: operations.md
  - Workload budgets: benchmarks/workload-budgets.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences

plugins:
  - search:
      separator: '[\s\-\.\_]+'
