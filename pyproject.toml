[build-system]
requires = ["babel>=2.12", "setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ckanext-dimred"
version = "0.0.1"
description = "CKAN resource view for dimensionality reduction and visualization of tabular data"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["CKAN", "dimensionality reduction", "visualize",]
requires-python = ">= 3.10"
dependencies = [
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "umap-learn>=0.5.9",
    "scikit-learn>=1.4.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
]
authors = [
    {name = "DataShades", email = "datashades@linkdigital.com.au"},
    {name = "Oleksandr Ivaniuk", email = "aleks.ivaniuk@gmail.com"},
]
maintainers = [
    {name = "DataShades", email = "datashades@linkdigital.com.au"},
]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[project.urls]
Homepage = "https://github.com/DataShades/ckanext-dimred"

[project.optional-dependencies]
dev = [
    "basedpyright>=1.19",
    "build>=1.2",
    "pytest-ckan",
    "pytest-playwright>=0.8",
    "ruff>=0.8",
]

[project.entry-points."ckan.plugins"]
dimred = "ckanext.dimred.plugin:DimredPlugin"

[tool.setuptools.packages.find]
include = ["ckanext*"]
exclude = ["ckanext.dimred.tests*"]


[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
       "ANN0", # type annotations for function arguments
       "B",  # likely bugs and design problems
       "BLE",  # do not catch blind exception
       "C4",  # better list/set/dict comprehensions
       "C90",  # check McCabe complexity
       "DTZ", # enforce timezone in date objects
       "E",  # pycodestyle error
       "W",  # pycodestyle warning
       "F",  # pyflakes
       "FA", # verify annotations from future
       "G",  # format strings for logging statements
       "N",  # naming conventions
       "I",  # isort
       "ICN", # import conventions
       # "D1",  # require doc
       "D2",  # doc formatting
       "D4",  # doc convention
       "PL",  # pylint
       "PERF", # performance anti-patterns
       "PT",  # pytest style
       "PIE",  # misc lints
       "RET",  # improvements for return statements
       "RSE",  # improvements for rise statements
       "S",  # security testing
       "SIM",  # simplify code
       "T10",  # debugging statements
       "T20",  # print statements
       "TID",  # tidier imports
       "TRY",  # better exceptions
       "UP",  # upgrade syntax for newer versions of the language
]

ignore = [
       "RET503", # don't enforce return-None
       "E712", # comparison to bool: violated by SQLAlchemy filters
       "PLC1901", # simplify comparison to empty string: violated by SQLAlchemy filters
]

[tool.ruff.lint.per-file-ignores]
"ckanext/dimred/tests*" = ["S", "PL", "ANN"]

[tool.ruff.lint.flake8-import-conventions.aliases]
"ckan.plugins" = "p"
"ckan.plugins.toolkit" = "tk"
sqlalchemy = "sa"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
section-order = [
              "future",
              "standard-library",
              "first-party",
              "third-party",
              "ckan",
              "ckanext",
              "self",
              "local-folder",
]

[tool.ruff.lint.isort.sections]
ckan = ["ckan"]
ckanext = ["ckanext"]
self = ["ckanext.dimred"]

[tool.pytest.ini_options]
addopts = "--ckan-ini test_config/test.ini -m 'not benchmark and not playwright'"
markers = [
    "benchmark: reproducible projection workload measurements run outside the default suite",
    "playwright: browser tests that require a running CKAN server",
]
filterwarnings = [
]
