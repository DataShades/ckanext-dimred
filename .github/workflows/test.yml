name: Tests
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    container:
      image: ckan/ckan-dev:2.11-py3.10
      options: --user root

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
    - name: Install quality dependencies
      run: |
        pip install --upgrade pip
        pip install -e '.[dev]'
        npm ci
    - name: Run static quality checks
      run: |
        ruff check ckanext/dimred
        python scripts/typecheck.py
        npm run lint:js

  test:
    strategy:
      matrix:
        include:
        - ckan-version: "2.11"
          coverage: true
        - ckan-version: "2.10"
          coverage: false
      fail-fast: false

    runs-on: ubuntu-latest
    container:
      image: ckan/ckan-dev:${{ matrix.ckan-version }}-py3.10
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr9
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:3
    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
    - uses: actions/checkout@v4
    - name: Install requirements
      run: |
        pip install --upgrade pip
        pip install -e '.[dev]'
    - name: Setup extension
      run: |
        # Replace default path to CKAN core config file with the one on the container
        sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test_config/test.ini
        ckan -c test_config/test.ini db init
    - name: Run tests
      run: |
        if [ "${{ matrix.coverage }}" = "true" ]; then
          pytest --ckan-ini=test_config/test.ini --cov=ckanext.dimred --cov-report=term-missing \
            --cov-fail-under=82 --disable-warnings ckanext/dimred
        else
          pytest --ckan-ini=test_config/test.ini --disable-warnings ckanext/dimred
        fi
    - name: Build and verify release wheel
      if: matrix.ckan-version == '2.11'
      run: |
        python -m build
        python - <<'PY'
        import email
        import pathlib
        import zipfile

        wheels = list(pathlib.Path("dist").glob("*.whl"))
        assert len(wheels) == 1, wheels

        with zipfile.ZipFile(wheels[0]) as archive:
            names = set(archive.namelist())
            metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
            metadata = email.message_from_bytes(archive.read(metadata_path))

        required = {
            "ckanext/dimred/config_declaration.yaml",
            "ckanext/dimred/assets/webassets.yml",
            "ckanext/dimred/i18n/ckanext-dimred.pot",
            "ckanext/dimred/templates/dimred/dimred_preview.html",
        }
        assert required <= names, required - names
        assert not any("/tests/" in name or name.endswith("/.gitignore") for name in names)
        assert metadata["Summary"]
        assert metadata["License-Expression"] == "AGPL-3.0-or-later"
        requirements = metadata.get_all("Requires-Dist")
        assert any(item.startswith("openpyxl>=3.1") for item in requirements)
        assert any(item.startswith("xlrd>=2.0") for item in requirements)
        PY
        pip install --force-reinstall --no-deps dist/*.whl
        ckan -c test_config/test.ini config describe dimred --format json
        cd /tmp
        python - <<'PY'
        import importlib.metadata
        import pathlib

        distribution = importlib.metadata.distribution("ckanext-dimred")
        package_root = pathlib.Path(distribution.locate_file("ckanext"))

        import ckanext.dimred.plugin as plugin

        assert pathlib.Path(plugin.__file__).is_relative_to(package_root)
        assert package_root.joinpath("dimred/config_declaration.yaml").is_file()
        PY

  browser:
    runs-on: ubuntu-latest
    container:
      image: ckan/ckan-dev:2.11-py3.10
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:2.11-solr9
      postgres:
        image: ckan/ckan-postgres-dev:2.11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:3
    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1
      CKAN_SITE_URL: http://127.0.0.1:5000

    steps:
    - uses: actions/checkout@v4
    - name: Install browser test dependencies
      run: |
        pip install --upgrade pip
        pip install -e '.[dev]'
        playwright install --with-deps chromium
    - name: Setup extension
      run: |
        sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test_config/test.ini
        ckan -c test_config/test.ini db init
    - name: Run browser tests
      shell: bash
      run: |
        set -euo pipefail
        setsid ckan -c test_config/test.ini jobs worker dimred > /tmp/ckanext-dimred-worker.log 2>&1 &
        worker_pid=$!
        setsid ckan -c test_config/test.ini run -t > /tmp/ckanext-dimred-browser.log 2>&1 &
        ckan_pid=$!
        cleanup() {
          status=$?
          kill -- -"$ckan_pid" 2>/dev/null || true
          kill -- -"$worker_pid" 2>/dev/null || true
          wait "$ckan_pid" 2>/dev/null || true
          wait "$worker_pid" 2>/dev/null || true
          if [ "$status" -ne 0 ]; then
            tail -200 /tmp/ckanext-dimred-browser.log || true
            tail -200 /tmp/ckanext-dimred-worker.log || true
          fi
          trap - EXIT
          exit "$status"
        }
        trap cleanup EXIT
        ready=false
        for attempt in $(seq 1 30); do
          if wget --quiet --spider --timeout=1 --tries=1 http://127.0.0.1:5000/api/3/action/status_show; then
            ready=true
            break
          fi
          sleep 1
        done
        test "$ready" = true
        pytest --ckan-ini=test_config/test.ini -m playwright --browser chromium \
          --base-url=http://127.0.0.1:5000 --screenshot only-on-failure \
          --tracing retain-on-failure --output test-results ckanext/dimred/tests/e2e
    - name: Upload browser artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: dimred-browser-artifacts
        path: test-results
        if-no-files-found: ignore
